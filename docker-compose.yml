services:

  mongo:
    image: mongo:7
    container_name: hr_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - hr_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hr_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017/hr_management_db
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    depends_on:
      - mongo
    networks:
      - hr_net

  frontend:
    build:
      context: ./hr-management-system-frontend
      dockerfile: Dockerfile
    container_name: hr_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - hr_net

volumes:
  mongo_data:

networks:
  hr_net:
    driver: bridge
